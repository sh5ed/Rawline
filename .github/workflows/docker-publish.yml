name: Build Rawline on New Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Проверка каждые 6 часов (занимает 3 секунды, если обновлений нет)

permissions:
  contents: read
  packages: write

jobs:
  check_release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Compare upstream release tag with GHCR tag
        id: check
        run: |
          LATEST_TAG=$(curl -fsSL https://api.github.com/repos/throneproj/Throne/releases/latest | grep -oE '"tag_name":\s*"[^"]+"' | cut -d'"' -f4)
          echo "Latest upstream tag: $LATEST_TAG"

          # Проверяем, существует ли уже образ с этим тегом в вашем GHCR
          TOKEN=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/rawline/manifests/$LATEST_TAG")

          if [ "$STATUS" = "200" ]; then
            echo "Image for $LATEST_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $LATEST_TAG detected! Starting build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_release
    if: needs.check_release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Rawline ${{ needs.check_release.outputs.tag }} linux-amd64
        run: |
          mkdir -p build-ctx/linux-amd64 extracted
          cp docker/Dockerfile build-ctx/Dockerfile
          RELEASE_URL=$(curl -fsSL https://api.github.com/repos/throneproj/Throne/releases/latest | grep -oE '"browser_download_url":\s*"[^"]*linux-amd64\.zip"' | cut -d'"' -f4 | head -n 1)
          echo "Downloading: $RELEASE_URL"
          curl -fsSL "$RELEASE_URL" -o rawline.zip
          unzip -q rawline.zip -d extracted
          ls -la extracted
    
          # Если внутри архива одна папка — берём содержимое из неё, иначе из корня extracted
          SUBDIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ] && [ "$(ls -1 extracted | wc -l)" -eq 1 ]; then
            cp -r "$SUBDIR"/. build-ctx/linux-amd64/
          else
            cp -r extracted/. build-ctx/linux-amd64/
          fi
    
          ls -la build-ctx/linux-amd64/

      - name: Get RAWLINE_API_REF and patch Dockerfile
        id: ref
        run: |
          API_REF=$(grep -rnE 'RAWLINE_API_REF' .github/workflows/ | grep -oE '[a-f0-9]{7,40}' | head -n 1)
          if [ -z "$API_REF" ]; then
            API_REF=$(git ls-remote https://github.com/throneproj/Throne-api.git refs/heads/dev | awk '{print $1}')
          fi
          [ -z "$API_REF" ] && API_REF="dev"
          echo "Using RAWLINE_API_REF: $API_REF"
          echo "api_ref=$API_REF" >> $GITHUB_OUTPUT
  
          # На случай если в Throne-api путь к CLI называется иначе, чем ./cmd/rawlinectl
          sed -i 's|go build -trimpath -o /out/rawlinectl ./cmd/rawlinectl|go build -trimpath -o /out/rawlinectl $(dirname $(find . -name "main.go" \| grep -E "rawline\|ctl" \| head -n 1))|g' build-ctx/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./build-ctx
          platforms: linux/amd64
          push: true
          build-args: |
            RAWLINE_API_REF=${{ steps.ref.outputs.api_ref }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rawline:latest
            ghcr.io/${{ github.repository_owner }}/rawline:${{ needs.check_release.outputs.tag }}
