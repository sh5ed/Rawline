name: Build Rawline on New Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  packages: write

jobs:
  check_release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Compare upstream release tag with GHCR tag
        id: check
        run: |
          LATEST_TAG=$(curl -fsSL "https://api.github.com/repos/throneproj/Throne/releases?per_page=1" | grep -oE '"tag_name":\s*"[^"]+"' | head -n 1 | cut -d'"' -f4)
          echo "Latest upstream tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to fetch release tag"
            exit 1
          fi

          TOKEN=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w0)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/rawline/manifests/$LATEST_TAG")

          if [ "$STATUS" = "200" ]; then
            echo "Image for $LATEST_TAG already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $LATEST_TAG detected! Starting build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check_release
    if: needs.check_release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Rawline ${{ needs.check_release.outputs.tag }} linux-amd64
        run: |
          mkdir -p build-ctx/linux-amd64 extracted
          cp docker/Dockerfile build-ctx/Dockerfile

          RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/throneproj/Throne/releases?per_page=1")
          RELEASE_URL=$(echo "$RELEASE_JSON" | grep -oE '"browser_download_url":\s*"[^"]*linux-amd64\.zip"' | head -n 1 | cut -d'"' -f4)

          echo "Downloading: $RELEASE_URL"
          curl -fsSL "$RELEASE_URL" -o rawline.zip
          unzip -q rawline.zip -d extracted

          BIN_PATH=$(find extracted -type f \( -name "Rawline" -o -name "Throne" \) | head -n 1)
          BIN_DIR=$(dirname "$BIN_PATH")
          cp -r "$BIN_DIR"/. build-ctx/linux-amd64/

          # Создаём символические ссылки Rawline -> Throne и RawlineCore -> ThroneCore
          cd build-ctx/linux-amd64
          [ -f Throne ] && [ ! -e Rawline ] && ln -s Throne Rawline
          [ -f ThroneCore ] && [ ! -e RawlineCore ] && ln -s ThroneCore RawlineCore
          chmod +x Throne ThroneCore thronectl Rawline RawlineCore
          ls -la

      - name: Patch Dockerfile for Throne-api
        run: |
          sed -i 's|if \[ -z "\$RAWLINE_API_REF" \].*git checkout -q FETCH_HEAD|git clone --depth=1 https://github.com/throneproj/Throne-api.git .|g' build-ctx/Dockerfile
          sed -i 's|go build -trimpath -o /out/rawlinectl ./cmd/rawlinectl|go build -trimpath -o /out/rawlinectl $(dirname $(find . -name "main.go" \| head -n 1))|g' build-ctx/Dockerfile
          cat build-ctx/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./build-ctx
          platforms: linux/amd64
          push: true
          build-args: |
            RAWLINE_API_REF=main
          tags: |
            ghcr.io/${{ github.repository_owner }}/rawline:latest
            ghcr.io/${{ github.repository_owner }}/rawline:${{ needs.check_release.outputs.tag }}
